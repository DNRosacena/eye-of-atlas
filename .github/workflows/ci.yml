name: CI

on:
  pull_request:
  push:
    branches: [main, 'stage-*/**']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Upstream God's Eye View verification, kept as inherited ────────────────
  # The app's own suite (~2,600 tests, including per-frame allocation budgets).
  # It is a valuable regression net for our Stage 1 refactors, so it is
  # preserved rather than replaced.
  verify:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [24.14.0, 26.x]
    env:
      PUPPETEER_SKIP_DOWNLOAD: '1'
      GEV_REQUIRE_ALLOCATION_GATE: ${{ matrix.node == '24.14.0' && '1' || '0' }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run setup policy checks
        run: npm run doctor -- --json

      - name: Run unit tests
        run: npm test

      - name: Build production bundle
        run: npm run build

  windows-onboarding:
    name: Windows onboarding
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PUPPETEER_SKIP_DOWNLOAD: '1'
      GEV_REQUIRE_ALLOCATION_GATE: '0'
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: npm

      - name: Run the Pinokio install path
        run: node scripts/pinokio-install.mjs

      - name: Run focused onboarding tests
        run: node --test src/setupDoctor.test.mjs src/pinokioEnvironment.test.mjs src/pinokioPreflight.test.mjs src/pinokioLauncherContract.test.mjs src/mapStartup.test.mjs src/hudSummaryResponse.test.mjs

      - name: Build production bundle
        run: npm run build

  # ── Eye of Atlas additions ────────────────────────────────────────────────

  worker:
    name: Worker (api-proxy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: workers/api-proxy
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: workers/api-proxy/package-lock.json

      - run: npm ci

      - name: Syntax check
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Audit
        run: npm audit --audit-level=high

  compliance:
    name: Compliance guards
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Cheap backstop against the one mistake that is expensive to undo.
      # .env.example placeholders are empty, so they do not trip this.
      - name: Scan for key-shaped literals
        run: |
          if git grep -nIE 'AIza[0-9A-Za-z_-]{30,}|sk-[A-Za-z0-9]{32,}|(FIRMS_MAP_KEY|GOOGLE_[A-Z_]*API_KEY|GEMINI_API_KEY)[[:space:]]*=[[:space:]]*[A-Za-z0-9_-]{16,}' \
               -- ':!*.md' ':!.github/workflows/*'; then
            echo "::error::Possible committed secret. Real keys belong in .env or the provider dashboard."
            exit 1
          fi
          echo "No key-shaped literals found."

      - name: Ensure .env is not tracked
        run: |
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "::error::.env is tracked by git. It must be gitignored."
            exit 1
          fi
          echo ".env is not tracked."

      # Class-D sources were removed for licensing reasons. Reintroducing one
      # would be a licence breach in an ad-supported product, so this fails the
      # build rather than relying on review to catch it.
      - name: No Class-D data source reintroduced
        run: |
          status=0
          check() {
            if git grep -nIE "$2" -- \
                 ':!*.md' ':!.github/workflows/*' ':!docs/*'; then
              echo "::error::Class-D source reintroduced: $1. See COMMERCIAL_COMPLIANCE.md."
              status=1
            fi
          }
          check "OpenSky"         'opensky-network\.org|/api/opensky'
          # The keyless Esri endpoint is Noncommercial-only. The licensed path
          # is ibasemaps-api.arcgis.com via ArcGIS Location Platform, so any
          # reappearance of the open host in code is a licensing regression.
          # Matched with the protocol so the DO-NOT-REVERT comments don't trip it.
          check "Esri keyless"    'https://services\.arcgisonline\.com'
          check "TeleGeography"   'telegeography|submarinecablemap'
          check "Google News RSS" 'news\.google\.com'
          check "Open-Meteo"      'api\.open-meteo\.com'
          if [ "$status" -eq 0 ]; then echo "No Class-D sources present."; fi
          exit "$status"
