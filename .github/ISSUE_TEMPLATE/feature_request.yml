name: Feature request
description: Suggest an improvement
labels: [enhancement, needs-triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the need, not just the solution.
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
    validations: { required: true }
  - type: checkboxes
    id: constraints
    attributes:
      label: Have you considered these?
      description: Eye of Atlas runs on free infrastructure and only uses commercially licensed data. Suggestions that fit those constraints are much easier to accept.
      options:
        - label: This does not require a paid or non-commercially-licensed data source
        - label: This does not require a database or persistent server storage
        - label: The app would still work if this feature were unavailable
