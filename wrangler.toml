# Eye of Atlas — Cloudflare deployment
#
# WORKERS WITH STATIC ASSETS, not Pages.
#
# The change plan originally specified Cloudflare Pages. Cloudflare's unified
# dashboard now creates repo-connected projects as WORKERS builds, whose
# injected deploy token carries Workers scope and not Pages scope — so
# `wrangler pages deploy` fails auth (code 10000) even for an account admin.
#
# Rather than fight that, this takes the path Cloudflare is steering toward,
# which is also better for us: a Worker can serve the static site AND the
# /api/* routes from ONE deployment. Pages cannot — it would need a separate
# Worker bound alongside it. That matters because /api/geocode (place search,
# a P0 feature) is currently Vite dev-server middleware with no production
# equivalent; folding it into this Worker is how it ships.
#
# Free tier: static asset requests are not billed; Worker invocations are
# 100,000/day. Serving assets does not consume invocations, so the budget is
# spent only on real /api/* calls.
#
# Commercial-use footing is unchanged: the Cloudflare free tier permits it,
# which is why Vercel was excluded (COMMERCIAL_COMPLIANCE.md §7).

name = "eye-of-atlas"
compatibility_date = "2026-08-28"

# Static build output. `not_found_handling` keeps deep links working for the
# SPA — but note it must NOT swallow /api/*: God's Eye View's dev server does
# exactly that, returning index.html with a 200 where JSON was expected, which
# is invisible until a layer silently renders nothing
# (docs/GEV-INSPECTION.md §5.4). Once a Worker script owns /api/*, that route
# is handled before asset serving and the fallback cannot reach it.
# The Worker script owns /api/* and delegates everything else to ASSETS. It is
# matched BEFORE asset serving, which is what stops not_found_handling from
# returning index.html with a 200 for an API route — the silent failure
# documented in docs/GEV-INSPECTION.md §5.4 and reproduced on this very
# deployment before the script existed.
main = "worker/index.js"

[assets]
directory = "./dist"
not_found_handling = "single-page-application"
# Named binding so the Worker can hand non-API requests back to static serving.
binding = "ASSETS"

# ═══════════════════════════════════════════════════════════════════════════
# ENVIRONMENT VARIABLES — build-time vs runtime. Get this wrong and the symptom
# is a variable that silently "disappears" from the dashboard after a deploy.
#
# There are TWO separate places, and they are not interchangeable:
#
#   1. BUILD variables            Settings -> Build
#      Available while `npm run build` runs. NOT wiped by a deploy.
#
#   2. RUNTIME variables/secrets  Settings -> Variables and Secrets
#      Available to the Worker at request time. For Workers (unlike Pages)
#      `wrangler deploy` treats THIS FILE as the source of truth and syncs
#      runtime bindings to match it. Because there is no [vars] block below,
#      every deploy resets them to none — so anything typed into that section
#      of the dashboard vanishes on the next build. That is Cloudflare doing
#      exactly what this config says, not a bug.
#
# Where each of ours belongs:
#
#   ARCGIS_API_KEY   BUILD.   Vite INLINES it via `define` (vite.config.js) and
#                             src/main.js reads it as import.meta.env at module
#                             scope. By the time the Worker runs, the value is
#                             already a literal inside dist/assets/index-*.js —
#                             or it is absent and the Esri basemap silently
#                             falls back to OSM, which is not licensed for
#                             production traffic. Setting it as a RUNTIME
#                             variable does nothing at all: nothing reads it
#                             there. It must be present WHILE THE BUILD RUNS,
#                             so a redeploy without a rebuild will not pick it
#                             up.
#
#   NODE_VERSION     BUILD.   Pins the toolchain (24). .nvmrc says the same;
#                             setting it explicitly avoids surprises.
#
#   FIRMS_MAP_KEY    RUNTIME, and a SECRET — when Stage 1 wires the fires
#   GEMINI_API_KEY   layer and Stage 3 wires Ask Atlas. These are real secrets
#                    that must never reach the browser, so they are read by the
#                    Worker at request time. Add them with
#                    `wrangler secret put NAME` — NOT through the dashboard,
#                    and NOT as [vars] here, because this file is committed.
#                    Secrets set via `wrangler secret put` are stored encrypted
#                    and are not clobbered by a deploy the way plain vars are.
# ═══════════════════════════════════════════════════════════════════════════

# ── Dashboard settings (not expressible here) ────────────────────────────────
#   Build command  : npm run build
#   Deploy command : npx wrangler deploy
