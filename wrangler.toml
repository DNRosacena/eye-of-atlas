# Eye of Atlas — Cloudflare Pages configuration
#
# WHY CLOUDFLARE PAGES: its free tier permits commercial use and bandwidth is
# unlimited. Vercel is EXCLUDED — its Hobby free tier is non-commercial, so the
# moment ads run we would be in breach. That is a licence exclusion, not a
# preference (COMMERCIAL_COMPLIANCE.md §7). Netlify is a documented fallback
# but caps bandwidth at 100 GB/month, which is tight for this payload.
#
# The API Worker is deployed SEPARATELY from workers/api-proxy/ and bound at
# /api/* so the app keeps calling same-origin paths and no client code differs
# between local development and production.

name = "eye-of-atlas"
pages_build_output_dir = "dist"
compatibility_date = "2026-08-28"

# ── Dashboard settings (not expressible here; set them in the Pages project) ──
#
#   Build command      : npm run build
#   Output directory   : dist
#   Node version       : 24            (NODE_VERSION env var; .nvmrc is also read)
#   Root directory     : /
#
#   Build-time environment variables:
#     GOOGLE_MAPS_API_KEY   — client-exposed by design. Before setting it,
#                             restrict the key to the Map Tiles API + your
#                             HTTP referrers, and set a HARD daily quota cap
#                             in Google Cloud (APIs & Services -> Quotas) plus
#                             a billing budget. The quota cap is the real
#                             spend control; referrer restriction is spoofable.
#                             See docs/STAGE0-CHANGE-PLAN.md §3.1.
#     CESIUM_ION_TOKEN      — leave UNSET. Cesium ion's ToS is unresolved for a
#                             public ad-supported product
#                             (COMMERCIAL_COMPLIANCE.md §2.2).
#
# ── Two things to verify on the first deploy ─────────────────────────────────
#
#   1. /api/* must reach the Worker, NOT the SPA fallback. God's Eye View's own
#      preview server returns index.html with a 200 for unmatched /api routes,
#      so the client receives HTML where it expects JSON and fails silently
#      (docs/GEV-INSPECTION.md §5.4). Confirm /api/health returns JSON.
#
#   2. Bundle size. The GEV production build is ~28 MB with one 2.7 MB asset.
#      Pages limits are 25 MiB per file and 20,000 files — within bounds, but
#      close enough to check rather than assume.
